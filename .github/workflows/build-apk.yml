name: Build GameLand Master APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract project
        run: unzip -q GameLandMaster-prototype.zip -d extracted

      - name: Fix Java compatibility
        working-directory: extracted/GameLandMaster
        run: |
          sed -i 's/JavaVersion.VERSION_1_8/JavaVersion.VERSION_17/g' app/build.gradle.kts

      - name: Build APK
        working-directory: extracted/GameLandMaster
        run: gradle assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: GameLandMaster-APK
          path: extracted/GameLandMaster/app/build/outputs/apk/debug/*.apk
