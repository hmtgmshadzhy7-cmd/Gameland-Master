name: Build GameLand Master APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract project
        run: unzip -q GameLandMaster-project-files.zip -d extracted

      - name: Build APK
        working-directory: extracted
        run: gradle assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: GameLandMaster-APK
          path: extracted/app/build/outputs/apk/debug/*.apk
